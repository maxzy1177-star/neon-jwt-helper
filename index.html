
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MENFESS Neon JWT Helper</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 16px;
    }
    button {
      padding: 12px;
      margin: 5px;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #eee;
      padding: 12px;
    }
  </style>
</head>
<body>
  <h2>MENFESS Neon JWT Helper</h2>

  <button id="login">Login GitHub</button>
  <button id="ambil">Ambil JWT</button>
  <button id="salin" disabled>Salin JWT</button>

  <pre id="hasil">Memuat SDK Neon...</pre>

  <script type="module">
    const AUTH_URL =
      "https://ep-floral-mode-bdx8y2cd.neonauth.c-8.us-east-2.aws.neon.tech/neondb/auth";

    const hasil = document.getElementById("hasil");
    const tombolSalin = document.getElementById("salin");

    let auth = null;
    let jwt = "";

    // 1. MEMUAT SDK
    try {
      const sdk = await import(
        "https://esm.sh/@neondatabase/auth?bundle"
      );

      if (
        typeof sdk.createAuthClient !== "function" ||
        typeof sdk.SupabaseAuthAdapter !== "function"
      ) {
        throw new Error(
          "Ekspor SDK Neon tidak ditemukan."
        );
      }

      auth = sdk.createAuthClient(AUTH_URL, {
        adapter: sdk.SupabaseAuthAdapter()
      });

      if (typeof auth.getSession !== "function") {
        throw new Error("getSession tidak tersedia.");
      }

      if (typeof auth.signInWithOAuth !== "function") {
        throw new Error("signInWithOAuth tidak tersedia.");
      }

      hasil.textContent =
        "SDK NEON SIAP\n" +
        "createAuthClient: OK\n" +
        "SupabaseAuthAdapter: OK\n" +
        "getSession: OK\n" +
        "OAuth: OK";

    } catch (error) {
      hasil.textContent =
        "GAGAL MEMUAT SDK:\n" + error.message;
    }

    // 2. LOGIN GITHUB
    document.getElementById("login").onclick = async () => {
      try {
        if (!auth) {
          throw new Error("SDK belum berhasil dimuat.");
        }

        hasil.textContent = "Menghubungkan ke GitHub...";

        const result = await auth.signInWithOAuth({
          provider: "github",
          options: {
            redirectTo: location.href
          }
        });

        if (result.error) {
          throw result.error;
        }

        hasil.textContent =
          "Login sedang diproses. Selesaikan autentikasi GitHub.";

      } catch (error) {
        hasil.textContent =
          "LOGIN GAGAL:\n" + error.message;
      }
    };

    // 3. AMBIL JWT NEON
    document.getElementById("ambil").onclick = async () => {
      jwt = "";
      tombolSalin.disabled = true;

      try {
        if (!auth) {
          throw new Error("SDK Neon tidak tersedia.");
        }

        hasil.textContent = "Mengambil sesi Neon...";

        const response = await auth.getSession({
          forceFetch: true
        });

        if (response.error) {
          throw response.error;
        }

        const session = response.data?.session;

        if (!session) {
          throw new Error(
            "Sesi kosong. Login GitHub terlebih dahulu."
          );
        }

        const accessToken = session.access_token;

        if (!accessToken) {
          throw new Error(
            "access_token tidak ditemukan pada sesi."
          );
        }

        const parts = accessToken.split(".");

        if (parts.length !== 3) {
          throw new Error(
            "Token bukan JWT dengan format tiga bagian."
          );
        }

        jwt = accessToken;
        tombolSalin.disabled = false;

        hasil.textContent =
          "BERHASIL: JWT NEON TERAMBIL\n" +
          "Panjang token: " + jwt.length + " karakter\n" +
          "Format JWT: VALID\n" +
          "Token siap digunakan.";

      } catch (error) {
        hasil.textContent =
          "GAGAL MENGAMBIL JWT:\n" + error.message;
      }
    };

    // 4. SALIN JWT
    tombolSalin.onclick = async () => {
      try {
        if (!jwt) {
          throw new Error("JWT masih kosong.");
        }

        await navigator.clipboard.writeText(jwt);

        hasil.textContent =
          "JWT berhasil disalin. Jaga kerahasiaannya.";

      } catch (error) {
        hasil.textContent =
          "GAGAL MENYALIN:\n" + error.message;
      }
    };
  </script>
</body>
</html>
