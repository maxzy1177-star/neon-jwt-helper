
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MENFESS Neon JWT Helper</title>
</head>
<body>
  <h2>MENFESS Neon JWT Helper</h2>
  <p>Pengujian Neon Auth dan JWT.</p>

  <button id="login">Login dengan GitHub</button>
  <button id="token">Ambil JWT</button>
  <button id="check">Periksa Login</button>
  <pre id="hasil">Memuat Neon...</pre>

  <script type="module">
    const AUTH_URL =
      "https://ep-floral-mode-bdx8y2cd.neonauth.c-8.us-east-2.aws.neon.tech/neondb/auth";

    const hasil = document.getElementById("hasil");

    let auth;

    async function init() {
      try {
        const sdk = await import(
          "https://esm.sh/@neondatabase/auth"
        );

        auth = sdk.createAuthClient(AUTH_URL, {
          adapter: sdk.SupabaseAuthAdapter()
        });

        hasil.textContent = "Neon Auth siap.";
      } catch (e) {
        hasil.textContent = "Inisialisasi gagal: " + e.message;
      }
    }

    document.getElementById("login").onclick = async () => {
      try {
        hasil.textContent = "Membuka login GitHub...";

        const result = await auth.signInWithOAuth({
          provider: "github",
          options: {
            redirectTo: location.origin + location.pathname
          }
        });

        if (result.error) throw result.error;

        if (result.data?.url) {
          location.assign(result.data.url);
        }
      } catch (e) {
        hasil.textContent = "Login gagal: " + e.message;
      }
    };

    document.getElementById("check").onclick = async () => {
      try {
        const result = await auth.getSession();

        if (result.error) throw result.error;

        hasil.textContent = result.data?.session
          ? "LOGIN BERHASIL"
          : "Belum login. Silakan login GitHub.";
      } catch (e) {
        hasil.textContent = "Pemeriksaan gagal: " + e.message;
      }
    };

    document.getElementById("token").onclick = async () => {
      try {
        hasil.textContent = "Mengambil JWT...";

        const result = await auth.getSession({
          forceFetch: true
        });

        if (result.error) throw result.error;

        const jwt = result.data?.session?.access_token;

        if (!jwt) {
          hasil.textContent =
            "JWT belum tersedia. Login ulang terlebih dahulu.";
          return;
        }

        hasil.textContent =
          "JWT BERHASIL DIPEROLEH!\n" +
          "Panjang token: " + jwt.length +
          " karakter.\n\nToken tidak ditampilkan demi keamanan.";

      } catch (e) {
        hasil.textContent = "Gagal mengambil JWT: " + e.message;
      }
    };

    init();
  </script>
</body>
</html>
