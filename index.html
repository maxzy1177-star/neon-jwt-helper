
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MENFESS Neon JWT Helper</title>
</head>
<body>
  <h2>MENFESS Neon JWT Helper</h2>
  <p>Pengujian login dan pengambilan JWT Neon.</p>

  <button id="login">Login GitHub</button>
  <button id="token">Ambil JWT</button>
  <pre id="hasil">Belum diperiksa.</pre>

  <script type="module">
    import {
      createAuthClient,
      SupabaseAuthAdapter
    } from "https://esm.sh/@neondatabase/auth";

    const AUTH_URL =
      "https://ep-floral-mode-bdx8y2cd.neonauth.c-8.us-east-2.aws.neon.tech/neondb/auth";

    const hasil = document.getElementById("hasil");

    const auth = createAuthClient(AUTH_URL, {
      adapter: SupabaseAuthAdapter()
    });

    hasil.textContent =
      "SDK dimuat. getSession: " +
      typeof auth.getSession;

    document.getElementById("login").onclick = async () => {
      hasil.textContent = "Menghubungkan ke GitHub...";
      try {
        const result = await auth.signInWithOAuth({
          provider: "github",
          options: {
            redirectTo: location.href
          }
        });

        if (result.error) throw result.error;

        hasil.textContent =
          "Permintaan login dikirim. Selesaikan login GitHub.";
      } catch (e) {
        hasil.textContent = "Login gagal: " + e.message;
      }
    };

    document.getElementById("token").onclick = async () => {
      hasil.textContent = "Memeriksa sesi Neon...";
      try {
        if (typeof auth.getSession !== "function") {
          throw new Error(
            "getSession tidak tersedia. Periksa pemuatan SDK."
          );
        }

        const result = await auth.getSession({
          forceFetch: true
        });

        if (result.error) throw result.error;

        const jwt = result.data?.session?.access_token;

        if (!jwt) {
          hasil.textContent =
            "Sesi belum ditemukan. Silakan login GitHub dahulu.";
          return;
        }

        if (jwt.split(".").length !== 3) {
          throw new Error("Token yang diterima bukan format JWT.");
        }

        hasil.textContent =
          "BERHASIL: JWT Neon diperoleh.\n" +
          "Panjang token: " + jwt.length +
          " karakter.\n" +
          "Token tidak ditampilkan demi keamanan.";
      } catch (e) {
        hasil.textContent = "Gagal mengambil JWT: " + e.message;
      }
    };
  </script>
</body>
</html>
