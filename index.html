
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MENFESS Neon JWT Helper</title>
</head>
<body>
  <h2>MENFESS Neon JWT Helper</h2>
  <p>Pengujian login dan JWT Neon Auth.</p>

  <button id="login">Login dengan GitHub</button>
  <button id="token">Ambil JWT</button>
  <button id="check">Periksa Login</button>
  <button id="logout">Logout</button>

  <pre id="hasil">Memuat Neon Auth...</pre>

  <script type="module">
    const AUTH_URL =
      "https://ep-floral-mode-bdx8y2cd.neonauth.c-8.us-east-2.aws.neon.tech/neondb/auth";

    const hasil = document.getElementById("hasil");

    let auth;

    async function init() {
      try {
        const { createAuthClient } =
          await import("https://esm.sh/@neondatabase/auth");

        auth = createAuthClient(AUTH_URL);

        hasil.textContent = "Neon Auth siap digunakan.";
      } catch (error) {
        hasil.textContent =
          "Gagal memuat SDK: " + error.message;
      }
    }

    document.getElementById("login").onclick = async () => {
      try {
        hasil.textContent = "Menghubungkan ke GitHub...";

        const result = await auth.signIn.social({
          provider: "github",
          callbackURL:
            location.origin + location.pathname
        });

        if (result?.error) throw result.error;

        if (result?.data?.url) {
          location.assign(result.data.url);
        }
      } catch (error) {
        hasil.textContent =
          "Login gagal: " + error.message;
      }
    };

    document.getElementById("token").onclick = async () => {
      try {
        hasil.textContent = "Mengambil JWT Neon...";

        const jwt = await auth.getJWTToken();

        if (!jwt) {
          hasil.textContent =
            "JWT kosong. Silakan login terlebih dahulu.";
          return;
        }

        hasil.textContent =
          "JWT BERHASIL DIPEROLEH!\n\n" +
          "Token tersedia dan tidak ditampilkan demi keamanan.\n" +
          "Panjang token: " + jwt.length + " karakter.";

      } catch (error) {
        hasil.textContent =
          "Gagal mengambil JWT: " + error.message;
      }
    };

    document.getElementById("check").onclick = async () => {
      try {
        const result = await auth.getSession();

        if (result.error) throw result.error;

        hasil.textContent = result.data?.user
          ? "LOGIN BERHASIL\nEmail: " +
            result.data.user.email
          : "Belum login.";
      } catch (error) {
        hasil.textContent =
          "Pemeriksaan gagal: " + error.message;
      }
    };

    document.getElementById("logout").onclick = async () => {
      try {
        await auth.signOut();
        hasil.textContent = "Berhasil logout.";
      } catch (error) {
        hasil.textContent =
          "Logout gagal: " + error.message;
      }
    };

    init();
  </script>
</body>
</html>
