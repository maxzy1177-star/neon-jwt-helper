
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MENFESS Neon JWT Helper</title>
</head>
<body>
  <h2>MENFESS Neon JWT Helper</h2>

  <button id="login">Login GitHub</button>
  <button id="ambil">Ambil JWT</button>
  <button id="salin" disabled>Salin JWT</button>

  <pre id="hasil">Memuat SDK...</pre>

  <script type="module">
    const AUTH_URL =
      "https://ep-floral-mode-bdx8y2cd.neonauth.c-8.us-east-2.aws.neon.tech/neondb/auth";

    const hasil = document.getElementById("hasil");
    const salin = document.getElementById("salin");

    let auth = null;
    let jwt = "";
    let initError = "";

    // INISIALISASI SDK
    try {
      const sdk = await import(
        "https://esm.sh/@neondatabase/auth"
      );

      if (typeof sdk.createAuthClient !== "function") {
        throw new Error("createAuthClient tidak ditemukan.");
      }

      if (typeof sdk.SupabaseAuthAdapter !== "function") {
        throw new Error("SupabaseAuthAdapter tidak ditemukan.");
      }

      auth = sdk.createAuthClient(AUTH_URL, {
        adapter: sdk.SupabaseAuthAdapter()
      });

      if (typeof auth.getSession !== "function") {
        throw new Error("getSession tidak tersedia.");
      }

      if (typeof auth.signInWithOAuth !== "function") {
        throw new Error("signInWithOAuth tidak tersedia.");
      }

      hasil.textContent =
        "SDK NEON BERHASIL DIMUAT\n" +
        "Adapter: OK\n" +
        "getSession: OK\n" +
        "OAuth: OK";

    } catch (e) {
      initError = e?.message || String(e);
      auth = null;

      hasil.textContent =
        "GAGAL MEMUAT SDK NEON:\n" + initError;
    }

    // LOGIN GITHUB
    document.getElementById("login").onclick =
      async () => {
        try {
          if (!auth) {
            throw new Error(initError || "SDK belum tersedia.");
          }

          hasil.textContent = "Membuka login GitHub...";

          const result = await auth.signInWithOAuth({
            provider: "github",
            options: {
              redirectTo: location.href
            }
          });

          if (result.error) throw result.error;

          hasil.textContent =
            "Login diproses. Selesaikan autentikasi GitHub.";

        } catch (e) {
          hasil.textContent =
            "LOGIN GAGAL:\n" + (e.message || String(e));
        }
      };

    // AMBIL JWT
    document.getElementById("ambil").onclick =
      async () => {
        jwt = "";
        salin.disabled = true;

        try {
          if (!auth) {
            throw new Error(initError || "SDK belum tersedia.");
          }

          hasil.textContent = "Memeriksa sesi Neon...";

          const response = await auth.getSession({
            forceFetch: true
          });

          if (response.error) throw response.error;

          const session = response.data?.session;

          if (!session) {
            throw new Error(
              "Sesi kosong. Login GitHub terlebih dahulu."
            );
          }

          const token = session.access_token;

          if (!token) {
            throw new Error("access_token tidak ditemukan.");
          }

          if (token.split(".").length !== 3) {
            throw new Error("Format JWT tidak valid.");
          }

          jwt = token;
          salin.disabled = false;

          hasil.textContent =
            "BERHASIL: JWT NEON TERAMBIL\n" +
            "Panjang: " + jwt.length + " karakter\n" +
            "Format JWT: VALID\n" +
            "JWT siap disalin.";

        } catch (e) {
          hasil.textContent =
            "GAGAL MENGAMBIL JWT:\n" +
            (e.message || String(e));
        }
      };

    // SALIN JWT
    salin.onclick = async () => {
      try {
        if (!jwt) throw new Error("JWT kosong.");

        await navigator.clipboard.writeText(jwt);

        hasil.textContent =
          "JWT berhasil disalin. Simpan dengan aman.";

      } catch (e) {
        hasil.textContent =
          "GAGAL MENYALIN:\n" + (e.message || String(e));
      }
    };
  </script>
</body>
</html>
